name: Refresh fixtures

# Regenerates gameweeks.json, teams.json and results.json daily and commits any
# changes: keeps round date-windows accurate after reschedules, and caches each
# newly-finished round's results so old rounds load fast (instead of live ESPN).
# Live/in-progress results are still read from ESPN in the browser. A push here
# re-triggers the Pages deploy.

on:
  schedule:
    - cron: '0 6 * * *' # every day 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-gameweeks.mjs
      - name: Commit if changed
        run: |
          git add public/data/gameweeks.json public/data/teams.json public/data/results.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh fixtures & cached results"
            git push
          else
            echo "No changes."
          fi
